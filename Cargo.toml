[package]
name = "herdr-agent-quota"
version = "1.6.0"
edition = "2021"
rust-version = "1.95"
description = "Credential-scoped AI quota and context in Herdr for Claude and Codex"
license = "MIT"
readme = "README.md"
repository = "https://github.com/levi-qiao/herdr-agent-quota"
homepage = "https://herdr.dev/plugins/"
keywords = ["herdr", "claude-code", "codex", "quota", "usage"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/screenshots/*", "docs/research/*", ".github/*"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
# Credential identity digests: a pane is matched to a credential store by a
# sha256 of the credential, never by the credential itself.
sha2 = "0.10"
# `preserve_order` keeps a user's own key order when `configure` rewrites
# ~/.claude/settings.json; without it every apply silently re-sorts their file.
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
# toml_edit rewrites Herdr config; `toml` reads it back in tests.
toml = "0.8"
toml_edit = "0.22"
ureq = { version = "2.12", features = ["json"] }

# Only used to put the Codex app-server in its own process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows has no process groups: a job object ends a child's whole tree.
# 0.61 is already in the lockfile through other crates.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.14"

[[bin]]
name = "herdr-agent-quota"
path = "src/main.rs"
